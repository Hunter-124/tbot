; CalRig B firmware (Arduino Uno + CNC Shield V3).  Build: `pio run -d software/firmware/calrig_uno`
; Flash:  `pio run -d software/firmware/calrig_uno -t upload`   (add --upload-port /dev/ttyACM0 if needed)
[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; only the sketch itself is firmware; test/ holds the host-side simulation harness
build_src_filter = +<*> -<test/> -<.pio/> -<.git/>
build_flags =
    -Wall
    -Wextra
; Override compile-time options here (see the top of calrig_uno.ino), e.g.:
;    -DMICROSTEPS=32
;    -DDIR_INVERT=1
;    -DESTOP_NC=0
