<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBOT Console</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>try { const t = localStorage.getItem("tbot.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="logo.svg" alt="">
      <div><div class="brand-name">TBOT</div><div class="brand-sub">Console</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="device-card" id="device-card"></div>
    </div>
  </aside>
  <div class="main">
    <div id="live-banner"></div>
    <header class="topbar">
      <div><h1 id="title">Overview</h1></div>
      <div class="spacer"></div>
      <div id="top-status" class="btn-row"></div>
      <button class="btn ghost icon" id="theme-btn" title="Light / dark"></button>
    </header>
    <main class="content"><div id="page" class="page"></div></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>
<div id="connect" class="connect hidden"></div>
<script src="app.js"></script>
</body>
</html>
